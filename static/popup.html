<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Translator</title>
    <style>
      /* popup.css */
      :root {
        --mdc-theme-primary: #1a73e8;
        --mdc-theme-surface: #ffffff;
        --mdc-theme-background: #f5f5f5;
        --text-color: rgba(0, 0, 0, 0.87);
        --text-secondary: rgba(0, 0, 0, 0.54);
        --input-bg: white;
        --input-border: rgba(0, 0, 0, 0.12);
        --status-success-background: #e8f5e9;
        --status-error-background: #ffebee;
        --status-success-text: #2e7d32;
        --status-error-text: #c62828;
        --surface-elevation: 0 3px 6px rgba(0, 0, 0, 0.16);
        --tab-bg: transparent;
        --tab-hover-bg: rgba(0, 0, 0, 0.04);
        --tab-active-bg: var(--mdc-theme-primary);
        --tab-active-text: white;
        --divider-color: rgba(0, 0, 0, 0.08);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --mdc-theme-surface: #121212;
          --mdc-theme-background: #1a1a1a;
          --text-color: rgba(255, 255, 255, 0.87);
          --text-secondary: rgba(255, 255, 255, 0.54);
          --input-bg: #181818;
          --input-border: rgba(255, 255, 255, 0.12);
          --status-success-background: #2e7d32;
          --status-error-background: #c62828;
          --status-success-text: #e8f5e9;
          --status-error-text: #ffebee;
          --surface-elevation: 0 3px 6px rgba(255, 255, 255, 0.16);
          --tab-hover-bg: rgba(255, 255, 255, 0.08);
          --divider-color: rgba(255, 255, 255, 0.08);
        }
      }

      body {
        margin: 0;
        font-family: 'Roboto', sans-serif;
        background-color: var(--mdc-theme-background);
        width: 440px;
        color: var(--text-color);
      }

      .container {
        background-color: var(--mdc-theme-surface);
        padding: 18px 20px;
        border-radius: 8px;
        box-shadow: var(--surface-elevation);
        box-sizing: border-box;
      }

      /* Profile tabs */
      .profile-tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 16px;
        align-items: center;
      }

      .profile-tab {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 6px 10px;
        border-radius: 4px;
        border: 1px solid var(--input-border);
        background: var(--tab-bg);
        color: var(--text-color);
        cursor: pointer;
        font-size: 0.8125rem;
        transition: all 0.15s ease;
        white-space: nowrap;
      }

      .profile-tab:hover {
        background: var(--tab-hover-bg);
      }

      .profile-tab.active {
        background: var(--tab-active-bg);
        color: var(--tab-active-text);
        border-color: var(--tab-active-bg);
      }

      .profile-tab .delete-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 16px;
        height: 16px;
        border: none;
        background: transparent;
        color: inherit;
        cursor: pointer;
        font-size: 14px;
        line-height: 1;
        padding: 0;
        border-radius: 50%;
        opacity: 0.6;
      }

      .profile-tab .delete-btn:hover {
        opacity: 1;
        background: rgba(0, 0, 0, 0.15);
      }

      .profile-tab.active .delete-btn:hover {
        background: rgba(255, 255, 255, 0.25);
      }

      .add-profile-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        border: 1px dashed var(--input-border);
        border-radius: 4px;
        background: transparent;
        color: var(--text-secondary);
        cursor: pointer;
        font-size: 18px;
        line-height: 1;
        padding: 0;
        transition: all 0.15s ease;
      }

      .add-profile-btn:hover {
        border-color: var(--mdc-theme-primary);
        color: var(--mdc-theme-primary);
        background: var(--tab-hover-bg);
      }

      /* Section titles */
      .section-title {
        font-size: 0.75rem;
        font-weight: 500;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin: 14px 0 8px 0;
      }

      .section-title:first-of-type {
        margin-top: 0;
      }

      .section-divider {
        border: none;
        border-top: 1px solid var(--divider-color);
        margin: 14px 0 2px 0;
      }

      .settings-group {
        margin-bottom: 14px;
        display: flex;
        gap: 10px;
        align-items: center;
      }

      label {
        flex: 0 0 92px;
        font-size: 0.875rem;
      }

      input[type='text'],
      textarea {
        flex: 1;
        padding: 12px;
        border: 1px solid var(--input-border);
        border-radius: 4px;
        font-size: 1rem;
        transition: all 0.2s ease-in-out;
        background-color: var(--input-bg);
        color: inherit;
      }

      textarea {
        min-height: 56px;
        max-height: 120px;
        resize: vertical;
        font-family: monospace;
        font-size: 0.875rem;
        line-height: 1.35;
        overflow: auto;
      }

      input[type='text']:focus,
      textarea:focus {
        outline: none;
        border-color: var(--mdc-theme-primary);
        box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.3);
        background-color: var(--input-bg);
      }

      input[type='text']:disabled,
      textarea:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .settings-group.multiline {
        align-items: flex-start;
      }

      .settings-group.multiline label {
        padding-top: 10px;
      }

      .button-group {
        display: flex;
        gap: 12px;
        margin-top: 18px;
      }

      button#translate {
        flex: 1;
        padding: 12px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 1rem;
        transition: all 0.2s ease-in-out;
        background-color: var(--mdc-theme-primary);
        color: white;
      }

      button#translate:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .settings-group label input[type='checkbox'] {
        margin-right: 8px;
        accent-color: var(--mdc-theme-primary);
      }

      .settings-group label {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
      }

      .settings-group label:hover {
        opacity: 0.8;
      }

      #translate:hover:not(:disabled) {
        background-color: #1557b0;
      }

      #translate.cancel {
        background-color: #b02a37;
        color: white;
      }

      #translate.cancel:hover {
        background-color: #8d1b26;
      }

      #status {
        margin-top: 12px;
        padding: 10px;
        border-radius: 4px;
        text-align: center;
        font-size: 0.875rem;
      }

      .success {
        background-color: var(--status-success-background);
        color: var(--status-success-text);
      }

      .error {
        background-color: var(--status-error-background);
        color: var(--status-error-text);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Profile tabs -->
      <div class="profile-tabs" id="profile-tabs"></div>

      <!-- API Configuration (per-profile) -->
      <div class="section-title">API Configuration</div>
      <div id="api-settings">
        <div class="settings-group">
          <label for="base-url">Base URL</label>
          <input type="text" id="base-url" placeholder="Enter base URL" />
        </div>

        <div class="settings-group">
          <label for="api-key">API Key</label>
          <input type="text" id="api-key" placeholder="Enter API key" />
        </div>

        <div class="settings-group">
          <label for="model">Model</label>
          <input type="text" id="model" placeholder="Enter model name" />
        </div>

        <div class="settings-group multiline">
          <label for="custom-args">Custom Args</label>
          <textarea
            id="custom-args"
            placeholder="e.g. {&quot;temperature&quot;: 0.7}"
            spellcheck="false"
          ></textarea>
        </div>
      </div>

      <!-- Divider -->
      <hr class="section-divider" />

      <!-- Translation Settings (global) -->
      <div class="section-title">Translation Settings</div>
      <div class="settings-group">
        <label for="target-lang">Target Language</label>
        <input type="text" id="target-lang" placeholder="e.g., English, 中文, ja-JP" />
      </div>

      <div class="settings-group">
        <input type="checkbox" id="replace-mode" />Replace original text with translation instead of inserting
      </div>

      <div class="button-group">
        <button id="translate" type="button">Translate Now</button>
      </div>

      <div id="status"></div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
